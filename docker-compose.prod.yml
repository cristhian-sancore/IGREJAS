version: '3.8'

services:
  # --- IGREJAS CORE ---
  igrejas-db:
    image: jacobalberty/firebird:3.0
    container_name: igrejas-db
    restart: always
    ports:
      - "3050:3050"
    environment:
      - ISC_PASSWORD=${ISC_PASSWORD:-masterkey}
    volumes:
      - igrejas_firebird_data:/firebird/data
    networks:
      - igrejas_network

  igrejas-backend:
    image: ghcr.io/cristhian-sancore/igrejas-backend:latest
    container_name: igrejas-backend
    restart: always
    ports:
      - "8000:8000"
    environment:
      - DB_HOST=igrejas-db
      - DB_PORT=3050
      - DB_USER=SYSDBA
      - DB_PASSWORD=${ISC_PASSWORD:-masterkey}
      - DB_NAME=/firebird/data/igrejas.fdb
      # S3 / Minio integration
      - S3_ENDPOINT=http://igrejas-minio:9000
      - S3_ACCESS_KEY=admin
      - S3_SECRET_KEY=password123
      - S3_BUCKET=igrejas-bucket
      - S3_PUBLIC_URL=https://s3.cristhiansancore.com.br
      # Redis integration
      - REDIS_URL=redis://igrejas-redis:6379
      # Evolution API Integration (URL Externa)
      - EVOLUTION_API_URL=${EVOLUTION_API_URL:-https://sua-evolution-api.com.br}
      - EVOLUTION_API_KEY=${EVOLUTION_API_KEY:-sua_apikey}
    depends_on:
      - igrejas-db
      - igrejas-minio
      - igrejas-redis
    networks:
      - igrejas_network

  igrejas-admin:
    image: ghcr.io/cristhian-sancore/igrejas-admin:latest
    container_name: igrejas-admin
    restart: always
    ports:
      - "8080:80"
    environment:
      - VITE_API_URL=${VITE_API_URL:-http://localhost:8000}
    networks:
      - igrejas_network

  igrejas-public:
    image: ghcr.io/cristhian-sancore/igrejas-public:latest
    container_name: igrejas-public
    restart: always
    ports:
      - "3500:3000"
    environment:
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    networks:
      - igrejas_network

  # --- INFRA & DEPENDENCIES ---
  igrejas-minio:
    image: minio/minio
    container_name: igrejas-minio
    restart: always
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: password123
      MINIO_SERVER_URL: "https://s3.cristhiansancore.com.br"
      MINIO_BROWSER_REDIRECT_URL: "https://minio.cristhiansancore.com.br"
    ports:
      - "9002:9000"
      - "9003:9001"
    volumes:
      - igrejas_minio_data:/data
    command: server /data --console-address "0.0.0.0:9001" --address "0.0.0.0:9000"
    networks:
      - igrejas_network

  igrejas-redis:
    image: redis:alpine
    container_name: igrejas-redis
    restart: always
    command: redis-server --appendonly yes
    ports:
      - "6380:6379"
    volumes:
      - igrejas_redis_data:/data
    networks:
      - igrejas_network

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: igrejas-cloudflared
    restart: always
    command: tunnel --no-autoupdate run --token eyJhIjoiNTliMjg0ZjliMjEyNDJhMzc4ZjRjMWY4OGY1YTU1YWMiLCJ0IjoiMGQyNjBjZWQtMGI0NC00NWMzLWJhNGMtNjI4ZjZiNzlhNDM5IiwicyI6Ik1HVmpNekZoTnpFdE5XVTVOeTAwTkdabUxUa3pNell0WmpkbE5qaGlNakJqTlRJNSJ9
    depends_on:
      - igrejas-public
      - igrejas-admin
      - igrejas-backend
    networks:
      - igrejas_network

volumes:
  igrejas_firebird_data:
  igrejas_minio_data:
  igrejas_redis_data:

networks:
  igrejas_network:
    driver: bridge
